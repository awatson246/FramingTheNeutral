# Model registry — single source of truth for collect_llm_responses.py and
# plot_response_results.py (loaded via scripts/model_registry.py).
#
# models: the v2 set; these are callable.
#   key                 identifier used in data files and instruments.json
#   label               display name in plots and progress output
#   provider            openai | anthropic | google | deepseek | mistral | xai
#   api_id              model ID sent to the provider API
#   color               plot color
#   reasoning_headroom  extra output tokens on top of each instrument's answer
#                       budget (MAX_TOKENS_OPEN / MAX_TOKENS_JSON), so reasoning
#                       tokens, which count against the same limit, can't cut
#                       the visible answer off. Only tokens actually used are billed.
#
# Provider capabilities come from docs/models_available.md (check_models.py).

models:
  - key: gpt-6.1-sol
    label: GPT-6.1 Sol
    provider: openai
    api_id: gpt-6.1-sol
    color: "#2176ae"
    reasoning_headroom: 16384   # reasoning model: rejects max_tokens, failed at 1 token

  - key: claude-sonnet-5-5
    label: Claude Sonnet 5.5
    provider: anthropic
    api_id: claude-sonnet-5-5
    color: "#16a34a"
    reasoning_headroom: 16384   # accepts effort, so may think by default; total stays
                                # under the SDK's ~21k non-streaming max_tokens ceiling

  - key: gemini-3.8-flash
    label: Gemini 3.8 Flash
    provider: google
    api_id: gemini-3.8-flash
    color: "#7c3aed"
    reasoning_headroom: 16384   # thinking=True; thought tokens count toward max_output_tokens

  - key: deepseek-flash
    label: DeepSeek Flash
    provider: deepseek
    api_id: deepseek-flash
    color: "#dc2626"
    reasoning_headroom: 16384   # reported reasoning_tokens > 0 on a 1-token call

  - key: mistral-medium-3.5
    label: Mistral Medium 3.5
    provider: mistral
    api_id: mistral-medium-3.5
    color: "#d97706"
    reasoning_headroom: 2048    # not known to reason (smoke test was rate-limited); small cushion

  - key: grok-4.7
    label: Grok 4.7
    provider: xai
    api_id: grok-4.7
    color: "#0d9488"
    reasoning_headroom: 16384   # reported reasoning_tokens > 0 on a 1-token call

# v1 models: labels/colors only, so plots of the existing data/raw files keep
# their names and colors. Not callable.
legacy_models:
  - {key: gpt-4o,                        label: GPT-4o,                color: "#2176ae"}
  - {key: claude-sonnet,                 label: Claude Sonnet,         color: "#16a34a"}
  - {key: deepseek-v3,                   label: DeepSeek-V3,           color: "#dc2626"}
  - {key: mistral-large,                 label: Mistral Large,         color: "#d97706"}
  - {key: gemini-3.1-flash-lite-preview, label: Gemini 3.1 Flash Lite, color: "#7c3aed"}
